spring.application.name=pago

server.port=8084

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/dbpago?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.pago.sql
spring.liquibase.drop-first=true
logging.level.com.pago.pago=DEBUG
logging.file.name=logs/microservicio-pago.log
#configuración Swagger
springdoc.swagger-ui.enabled=true
#Url del Swagger
springdoc.swagger-ui.path=/doc/swagger-ui.html