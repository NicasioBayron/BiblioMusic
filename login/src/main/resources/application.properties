server.port=8081
spring.application.name=login
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/login_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Cambiar el nivel de log para todo el proyecto
logging.level.root=INFO

# Ver los logs detallados de tus propios paquetes (tu lógica de login)
logging.level.com.login.login=DEBUG

# Ver las consultas SQL que Hibernate hace a MySQL
logging.level.org.hibernate.SQL=DEBUG
# Configuración de JWT
spring.jwt.secret=9f3c2a87d1e64b55c6f4ab90e1d73c5f2d89b7aa34df56e0a1bf92c47e68d12f
spring.jwt.expiration=3600000 

spring.liquibase.change-log=classpath:db/changelog/db.bdusuario.sql
spring.liquibase.enabled=true
spring.liquibase.drop-first=true
logging.file.name=logs/microservicio-login.log
#configuración Swagger
springdoc.swagger-ui.enabled=true
#Url del Swagger
springdoc.swagger-ui.path=/doc/swagger-ui.html
