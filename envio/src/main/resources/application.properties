spring.application.name=envio

server.port=8085

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/dbenvio?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.envio.sql
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.liquibase.drop-first=true
logging.level.com.envio.envio=DEBUG
logging.file.name=logs/microservicio-envio.log
#configuración Swagger
springdoc.swagger-ui.enabled=true
#Url del Swagger
springdoc.swagger-ui.path=/doc/swagger-ui.html